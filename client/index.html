<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Ресторан "Смаколик"</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: #e0e0e0; padding: 20px; max-width: 1200px; margin: auto; }
        h1, h2, h3 { color: #f39c12; }
        h1, h2 { text-align: center; }
        
        .dishes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .card { 
            background: #1e1e1e; 
            border-radius: 8px; 
            border: 1px solid #333; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.4); 
            transition: transform 0.2s;
        }
        .card:hover { transform: translateY(-4px); border-color: #f39c12; }
        .dish-image { width: 100%; height: 180px; object-fit: cover; border-bottom: 2px solid #333; background: #2a2a2a; }
        .dish-content { padding: 15px; display: flex; flex-direction: column; justify-content: space-between; flex-grow: 1; }
        .dish-header { display: flex; justify-content: space-between; align-items: start; margin-bottom: 8px; }
        .dish-title { margin: 0; font-size: 1.2em; color: #fff; }
        .price { color: #27ae60; font-weight: bold; font-size: 1.1em; white-space: nowrap; margin-left: 10px; }
        .dish-desc { margin: 0; color: #b0b0b0; font-size: 0.9em; line-height: 1.4; }
        
        input, textarea { width: 100%; padding: 10px; margin-bottom: 10px; background: #2a2a2a; color: #fff; border: 1px solid #444; border-radius: 4px; box-sizing: border-box; }
        button { background: #f39c12; color: #121212; font-weight: bold; border: none; padding: 12px; border-radius: 4px; cursor: pointer; width: 100%; font-size: 1.05em; }
        button:hover { background: #e67e22; }
        .form-card { background: #1a1a1a; padding: 20px; border-radius: 8px; margin: 30px auto; max-width: 600px; border: 1px solid #444; }

        /* Плаваючий чат-бот у лівому нижньому куті */
        .ai-floating-container {
            position: fixed;
            bottom: 20px;
            left: 20px;
            width: 300px;
            background: #1a1a1a;
            border: 1px solid #2980b9;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.6);
            z-index: 1000;
        }
        .ai-response {
            margin-top: 10px;
            padding: 10px;
            background: #222b35;
            border-left: 4px solid #3498db;
            border-radius: 4px;
            color: #ecf0f1;
            font-size: 0.9em;
            line-height: 1.4;
            display: none;
            max-height: 140px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <h1>🍽️ Ресторан "Смаколик"</h1>
    <p style="text-align: center;">Авторське меню та інтелектуальний підбір страв</p>

    <!-- Плаваючий блок ШІ-Офіціанта у лівому нижньому куті -->
    <div class="ai-floating-container">
        <h4 style="color: #3498db; margin-top: 0; margin-bottom: 10px;">🤖 ШІ-Офіціант (Gemini)</h4>
        <form id="aiForm">
            <input type="text" id="aiInput" placeholder="Порадьте страву..." required style="margin-bottom: 8px; padding: 8px; font-size: 0.9em;">
            <button type="submit" id="aiSubmitBtn" style="background: #3498db; color: #fff; padding: 8px; font-size: 0.95em;">Запитати</button>
        </form>
        <div id="aiResponseBox" class="ai-response"></div>
    </div>

    <div class="form-card">
        <h3 style="margin-top: 0;">Додати нову страву до меню</h3>
        <form id="dishForm">
            <input type="text" id="titleInput" placeholder="Назва страви..." required>
            <textarea id="descInput" placeholder="Опис та склад..." required></textarea>
            <input type="number" id="priceInput" placeholder="Ціна (грн)" required min="1">
            <input type="text" id="imageInput" placeholder="Шлях до картинки (наприклад, /images/pizza.jpg)">
            <button type="submit">Додати в меню</button>
        </form>
    </div>

    <h2>Наше Меню</h2>
    <div id="dishesList" class="dishes-grid">Завантаження меню...</div>

    <script>
        const titleInput = document.getElementById('titleInput');
        const descInput = document.getElementById('descInput');
        const priceInput = document.getElementById('priceInput');
        const imageInput = document.getElementById('imageInput');
        const dishForm = document.getElementById('dishForm');
        const dishesList = document.getElementById('dishesList');

        const aiForm = document.getElementById('aiForm');
        const aiInput = document.getElementById('aiInput');
        const aiSubmitBtn = document.getElementById('aiSubmitBtn');
        const aiResponseBox = document.getElementById('aiResponseBox');

        const initialDishes = [
            { id: "1", title: "Піца Маргарита", description: "Класична італійська піца з томатним соусом, моцарелою та свіжим базиліком.", price: 220, imageUrl: "/images/pizza.jpg" },
            { id: "2", title: "Салат Цезар", description: "Свіжий айсберг, курка гриль, соус цезар, сухарики та пармезан.", price: 195, imageUrl: "/images/caesar.jpg" },
            { id: "3", title: "Стейк з лосося", description: "Ніжний лосось на грилі з лимонним соусом та травами.", price: 420, imageUrl: "/images/placeholder.jpg" },
            { id: "4", title: "Суп Том Ям", description: "Традиційний гострий тайський суп з креветками та кокосовим молоком.", price: 260, imageUrl: "/images/placeholder.jpg" },
            { id: "5", title: "Бургер 'Black Angus'", description: "Соковита яловича котлета, сир чедер, бекон, соус барбекю.", price: 280, imageUrl: "/images/placeholder.jpg" },
            { id: "6", title: "Паста Карбонара", description: "Спагеті з гуанчале, яєчним жовтком, сиром пекорино романо та чорним перцем.", price: 210, imageUrl: "/images/placeholder.jpg" },
            { id: "7", title: "Грецький салат", description: "Свіжі овочі, сир фета, оливкова олія та орегано.", price: 170, imageUrl: "/images/placeholder.jpg" },
            { id: "8", title: "Курячий бульйон", description: "Домашній бульйон з лапшею, перепелиним яєчком та зеленню.", price: 130, imageUrl: "/images/placeholder.jpg" },
            { id: "9", title: "Рол 'Філадельфія'", description: "Лосось, крем-сир, авокадо, рис, норі.", price: 340, imageUrl: "/images/placeholder.jpg" },
            { id: "10", title: "Рол 'Каліфорнія'", description: "Краб-суримі, авокадо, огірок, ікра масаго.", price: 290, imageUrl: "/images/placeholder.jpg" },
            { id: "11", title: "Телячі медальйони", description: "Ніжне м'ясо телятини під ягідним соусом.", price: 390, imageUrl: "/images/placeholder.jpg" },
            { id: "12", title: "Орзо з морепродуктами", description: "Макарони орзо з креветками, мідіями у білому вині.", price: 350, imageUrl: "/images/placeholder.jpg" },
            { id: "13", title: "Сирна тарілка", description: "Асорті елітних сирів з медом та горіхами.", price: 320, imageUrl: "/images/placeholder.jpg" },
            { id: "14", title: "М’ясне асорті", description: "Ковбаски власного виробництва, буженина, хамон.", price: 380, imageUrl: "/images/placeholder.jpg" },
            { id: "15", title: "Млинці з лососем", description: "Тонкі млинці з вершковим сиром та слабосолоним лососем.", price: 180, imageUrl: "/images/placeholder.jpg" },
            { id: "16", title: "Десерт 'Тірамісу'", description: "Італійське печиво савоярді, сир маскарпоне та кава.", price: 160, imageUrl: "/images/placeholder.jpg" },
            { id: "17", title: "Чізкейк Нью-Йорк", description: "Класичний ніжний сирний десерт на пісочній основі.", price: 150, imageUrl: "/images/placeholder.jpg" },
            { id: "18", title: "Лимонад цитрусовий", description: "Освіжаючий авторський напій з апельсином та м'ятою.", price: 90, imageUrl: "/images/placeholder.jpg" },
            { id: "19", title: "Фреш апельсиновий", description: "Свіжовижатий сік 100%.", price: 120, imageUrl: "/images/placeholder.jpg" },
            { id: "20", title: "Кава Капучино", description: "Еспресо з пишною молочною пінкою.", price: 75, imageUrl: "/images/placeholder.jpg" }
        ];

        window.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('draft_title')) titleInput.value = localStorage.getItem('draft_title');
            if (localStorage.getItem('draft_desc')) descInput.value = localStorage.getItem('draft_desc');
            if (localStorage.getItem('draft_price')) priceInput.value = localStorage.getItem('draft_price');
            if (localStorage.getItem('draft_image')) imageInput.value = localStorage.getItem('draft_image');
            fetchDishes();
        });

        titleInput.addEventListener('input', (e) => localStorage.setItem('draft_title', e.target.value));
        descInput.addEventListener('input', (e) => localStorage.setItem('draft_desc', e.target.value));
        priceInput.addEventListener('input', (e) => localStorage.setItem('draft_price', e.target.value));
        imageInput.addEventListener('input', (e) => localStorage.setItem('draft_image', e.target.value));

        aiForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const message = aiInput.value.trim();
            if (!message) return;

            aiSubmitBtn.disabled = true;
            aiSubmitBtn.textContent = 'Аналізую...';
            aiResponseBox.style.display = 'block';
            aiResponseBox.textContent = 'Формування поради...';

            try {
                const res = await fetch('/api/ai/recommend', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message })
                });
                const data = await res.json();

                if (res.ok) {
                    aiResponseBox.textContent = data.reply;
                } else {
                    aiResponseBox.textContent = 'Помилка: ' + (data.error || 'Не вдалося отримати відповідь');
                }
            } catch (err) {
                aiResponseBox.textContent = 'Помилка з’єднання із сервером.';
            } finally {
                aiSubmitBtn.disabled = false;
                aiSubmitBtn.textContent = 'Запитати';
            }
        });

        async function fetchDishes() {
            try {
                const res = await fetch('/api/dishes');
                let dishes = await res.json();

                if (dishes.length <= 2) {
                    dishes = initialDishes;
                }

                dishesList.innerHTML = dishes.map(dish => `
                    <div class="card">
                        <img src="${dish.imageUrl || '/images/placeholder.jpg'}" alt="${dish.title}" class="dish-image" onerror="this.src='https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=400'">
                        <div class="dish-content">
                            <div>
                                <div class="dish-header">
                                    <h3 class="dish-title">${dish.title}</h3>
                                    <span class="price">${dish.price} грн</span>
                                </div>
                                <p class="dish-desc">${dish.description}</p>
                            </div>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                dishesList.innerHTML = '<p style="color:red; text-align:center;">Помилка завантаження меню.</p>';
            }
        }

        dishForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = titleInput.value;
            const description = descInput.value;
            const price = Number(priceInput.value);
            const imageUrl = imageInput.value;

            const res = await fetch('/api/dishes', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title, description, price, imageUrl })
            });

            if (res.ok) {
                titleInput.value = '';
                descInput.value = '';
                priceInput.value = '';
                imageInput.value = '';
                localStorage.removeItem('draft_title');
                localStorage.removeItem('draft_desc');
                localStorage.removeItem('draft_price');
                localStorage.removeItem('draft_image');
                fetchDishes();
            } else {
                const errData = await res.json();
                alert('Помилка валідації: ' + (errData.error || 'Некоректні дані'));
            }
        });
    </script>
</body>
</html>
