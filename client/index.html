<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Ресторан "Смаколик"</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: #e0e0e0; padding: 20px; max-width: 800px; margin: auto; }
        h1, h2, h3 { color: #f39c12; }
        h1, h2 { text-align: center; }
        .card { background: #1e1e1e; padding: 0; margin-bottom: 15px; border-radius: 8px; border: 1px solid #333; overflow: hidden; display: flex; box-shadow: 0 4px 8px rgba(0,0,0,0.4); }
        .dish-image { width: 150px; height: 150px; object-fit: cover; flex-shrink: 0; border-right: 2px solid #333; }
        .dish-content { padding: 15px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .dish-header { display: flex; justify-content: space-between; align-items: start; margin-bottom: 8px; }
        .dish-title { margin: 0; font-size: 1.3em; color: #fff; }
        .price { color: #27ae60; font-weight: bold; font-size: 1.2em; white-space: nowrap; margin-left: 10px; }
        .dish-desc { margin: 0 0 10px 0; color: #b0b0b0; font-size: 0.95em; line-height: 1.4; }
        input, textarea { width: 100%; padding: 10px; margin-bottom: 10px; background: #2a2a2a; color: #fff; border: 1px solid #444; border-radius: 4px; box-sizing: border-box; }
        button { background: #f39c12; color: #121212; font-weight: bold; border: none; padding: 12px; border-radius: 4px; cursor: pointer; width: 100%; font-size: 1.05em; }
        button:hover { background: #e67e22; }
        .form-card { background: #1a1a1a; padding: 20px; border-radius: 8px; margin-bottom: 25px; border: 1px solid #444; }

        /* Стилі для плаваючого чат-бота у лівому нижньому куті */
        .ai-floating-container {
            position: fixed;
            bottom: 20px;
            left: 20px;
            width: 320px;
            background: #1a1a1a;
            border: 1px solid #2980b9;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.6);
            z-index: 1000;
        }
        .ai-response {
            margin-top: 10px;
            padding: 10px;
            background: #222b35;
            border-left: 4px solid #3498db;
            border-radius: 4px;
            color: #ecf0f1;
            font-size: 0.9em;
            line-height: 1.4;
            display: none;
            max-height: 150px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <h1>🍽️ Ресторан "Смаколик" 🍽️</h1>
    <p style="text-align: center;">Меню та онлайн-замовлення</p>

    <!-- Плаваючий блок ШІ-Офіціанта у лівому нижньому куті -->
    <div class="ai-floating-container">
        <h4 style="color: #3498db; margin-top: 0; margin-bottom: 10px;">🤖 ШІ-Офіціант (Gemini)</h4>
        <form id="aiForm">
            <input type="text" id="aiInput" placeholder="Порадьте страву..." required style="margin-bottom: 8px; padding: 8px; font-size: 0.9em;">
            <button type="submit" id="aiSubmitBtn" style="background: #3498db; color: #fff; padding: 8px; font-size: 0.95em;">Запитати</button>
        </form>
        <div id="aiResponseBox" class="ai-response"></div>
    </div>

    <div class="form-card" style="max-width: 500px; margin: 0 auto 30px auto;">
        <h3 style="margin-top: 0;">Додати нову страву</h3>
        <form id="dishForm">
            <input type="text" id="titleInput" placeholder="Назва страви..." required>
            <textarea id="descInput" placeholder="Опис та склад..." required></textarea>
            <input type="number" id="priceInput" placeholder="Ціна (грн)" required min="1">
            <input type="text" id="imageInput" placeholder="Шлях до картинки (наприклад, /images/pizza.jpg)">
            <button type="submit">Додати в меню</button>
        </form>
    </div>

    <div style="max-width: 600px; margin: auto;">
        <h2>Наше Меню</h2>
        <div id="dishesList">Завантаження...</div>
    </div>

    <script>
        const titleInput = document.getElementById('titleInput');
        const descInput = document.getElementById('descInput');
        const priceInput = document.getElementById('priceInput');
        const imageInput = document.getElementById('imageInput');
        const dishForm = document.getElementById('dishForm');
        const dishesList = document.getElementById('dishesList');

        const aiForm = document.getElementById('aiForm');
        const aiInput = document.getElementById('aiInput');
        const aiSubmitBtn = document.getElementById('aiSubmitBtn');
        const aiResponseBox = document.getElementById('aiResponseBox');

        window.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('draft_title')) titleInput.value = localStorage.getItem('draft_title');
            if (localStorage.getItem('draft_desc')) descInput.value = localStorage.getItem('draft_desc');
            if (localStorage.getItem('draft_price')) priceInput.value = localStorage.getItem('draft_price');
            if (localStorage.getItem('draft_image')) imageInput.value = localStorage.getItem('draft_image');
            fetchDishes();
        });

        titleInput.addEventListener('input', (e) => localStorage.setItem('draft_title', e.target.value));
        descInput.addEventListener('input', (e) => localStorage.setItem('draft_desc', e.target.value));
        priceInput.addEventListener('input', (e) => localStorage.setItem('draft_price', e.target.value));
        imageInput.addEventListener('input', (e) => localStorage.setItem('draft_image', e.target.value));

        aiForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const message = aiInput.value.trim();
            if (!message) return;

            aiSubmitBtn.disabled = true;
            aiSubmitBtn.textContent = 'Аналізую...';
            aiResponseBox.style.display = 'block';
            aiResponseBox.textContent = 'Формування поради...';

            try {
                const res = await fetch('/api/ai/recommend', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message })
                });
                const data = await res.json();

                if (res.ok) {
                    aiResponseBox.textContent = data.reply;
                } else {
                    aiResponseBox.textContent = 'Помилка: ' + (data.error || 'Не вдалося отримати відповідь');
                }
            } catch (err) {
                aiResponseBox.textContent = 'Помилка з’єднання із сервером.';
            } finally {
                aiSubmitBtn.disabled = false;
                aiSubmitBtn.textContent = 'Запитати';
            }
        });

        async function fetchDishes() {
            try {
                const res = await fetch('/api/dishes');
                const dishes = await res.json();

                if (dishes.length === 0) {
                    dishesList.innerHTML = '<p style="text-align:center;">Меню порожнє.</p>';
                    return;
                }

                dishesList.innerHTML = dishes.map(dish => `
                    <div class="card">
                        <img src="${dish.imageUrl}" alt="${dish.title}" class="dish-image">
                        <div class="dish-content">
                            <div>
                                <div class="dish-header">
                                    <h3 class="dish-title">${dish.title}</h3>
                                    <span class="price">${dish.price} грн</span>
                                </div>
                                <p class="dish-desc">${dish.description}</p>
                            </div>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                dishesList.innerHTML = '<p style="color:red; text-align:center;">Помилка сервера.</p>';
            }
        }

        dishForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = titleInput.value;
            const description = descInput.value;
            const price = Number(priceInput.value);
            const imageUrl = imageInput.value;

            const res = await fetch('/api/dishes', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title, description, price, imageUrl })
            });

            if (res.ok) {
                titleInput.value = '';
                descInput.value = '';
                priceInput.value = '';
                imageInput.value = '';
                localStorage.removeItem('draft_title');
                localStorage.removeItem('draft_desc');
                localStorage.removeItem('draft_price');
                localStorage.removeItem('draft_image');
                fetchDishes();
            } else {
                const errData = await res.json();
                alert('Помилка валідації: ' + (errData.error || 'Некоректні дані'));
            }
        });
    </script>
</body>
</html>
